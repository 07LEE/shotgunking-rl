<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="review-token" content="__TOKEN__">
    <title>Piece Annotation Review</title>
    <link rel="stylesheet" href="/review_collection.css">
    <script src="/review_collection.js" defer></script>
</head>
<body>
    <div class="app">
        <header class="page-header">
            <h1>Screenshot review</h1>
        <section class="review-type" aria-labelledby="reviewTypeHeading">
            <h2 id="reviewTypeHeading">Review type</h2>
                <div class="review-tabs" role="tablist" aria-label="Review category" aria-orientation="horizontal">
                    <button id="piecesTab" role="tab" aria-selected="true" aria-controls="piecesView piecesControls" tabindex="0">Pieces</button>
                    <button id="screenTab" role="tab" aria-selected="false" aria-controls="screenView screenControls" tabindex="-1">Screen type</button>
                    <button id="ammoTab" role="tab" aria-selected="false" aria-controls="screenView screenControls" tabindex="-1">Ammunition</button>
                    <button id="combatTab" role="tab" aria-selected="false" aria-controls="screenView screenControls" tabindex="-1">Combat stats</button>
                    <button id="soulTab" role="tab" aria-selected="false" aria-controls="screenView screenControls" tabindex="-1">Harvested souls</button>
                </div>
        </section>
        </header>
                <section class="review-summary" aria-label="Review completion">
                    <div class="review-summary-heading"><p id="reviewSummaryText" role="status"></p><div class="button-row"><button id="previous" aria-label="Previous screenshot" title="Previous screenshot">←</button><button id="next" aria-label="Next screenshot" title="Next screenshot">→</button></div></div>
                    <p id="currentScreenshot" class="current-screenshot"></p>
                    <div id="reviewSectionStatus" class="review-section-status"></div>
                </section>
        <div class="review-workspace">
            <aside class="review-sidebar" aria-label="Review queue">
                <h2>Review queue</h2>

                <label class="toggle completed-filter"><input type="checkbox" id="showCompleted"> Show completed</label>
                <p id="queueTotals" class="help"></p>
                <nav id="sessionList" aria-label="Screenshots grouped by session"></nav>
            </aside>
            <div class="review-content">

        <main>


            <div id="piecesView" class="review-view" role="tabpanel" aria-labelledby="piecesTab">
<section class="panel board-panel" aria-label="Board review">
                <div class="panel-heading"><h2>Game board</h2><label class="toggle"><input type="checkbox" id="showLabels" checked> Piece names</label></div>
                <div class="board-frame">
                    <div class="files" aria-label="Board files"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div>
                    <div class="ranks" aria-label="Board ranks"><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span></div>
                    <div id="board"><img id="image" alt="Game board"><div id="grid"></div></div>
                </div>
                <div class="board-footer"><p id="cellInfo" aria-live="polite">Select a cell to correct its label.</p><div class="legend"><span class="legend-selected"></span> Selected <span class="legend-excluded"></span> Excluded</div></div>

            </section>

            </div>
            <div id="screenView" class="review-view" role="tabpanel" aria-labelledby="screenTab" hidden>
                <section class="panel screen-panel">
                    <div class="panel-heading"><h2>Screenshot</h2></div>
                    <div class="screen-overview">
                        <a id="fullLink" target="_blank" rel="noopener"><img id="fullImage" alt="Full game screen"></a>
                    </div>
                    <a class="image-link" id="openOriginal" target="_blank" rel="noopener">Open full size ↗</a>
                </section>

            </div>

<div class="review-controls"><div class="input-scroll"><aside id="piecesControls"><section class="panel controls"><div class="panel-heading"><h2>Piece details</h2></div>
                    <label>Selected cell label<select id="label"></select></label>
                    <label>Piece side<select id="pieceSide"><option value="">No piece</option><option value="ally">Ally (black)</option><option value="enemy">Enemy (white)</option><option value="unknown">Unknown</option></select></label>
                    <label>Moat card effect<select id="moatActive"><option value="">Unknown</option><option value="false">Inactive</option><option value="true">Active</option></select></label>

                    <label class="toggle"><input type="checkbox" id="locked"> Locked by ability</label>
                    <label class="toggle exclude-toggle"><input type="checkbox" id="excluded"> Exclude this cell from training</label>
                </section></aside><aside id="screenControls" hidden><section class="panel controls">
                    <h2 id="taskTitle">Screen type</h2>
                    <div class="task-fields" data-review-task="screen_kind">
                        <label>Screen kind<select id="screenKind"><option value="">Unknown</option><option value="gameplay">Gameplay</option><option value="card_selection">Card selection</option><option value="retry">Retry</option><option value="transition">Transition</option></select></label>
                        <label>Floor<input id="floor" type="number" min="1" step="1" placeholder="Unknown"></label>
                    </div>
                    <div class="task-fields" data-review-task="ammo" hidden>
                        <label>Loaded ammo<input id="ammo_loaded" type="number" min="0" step="1" placeholder="Unknown"></label>
                        <label>Reserve ammo<input id="ammo_reserve" type="number" min="0" step="1" placeholder="Unknown"></label>
                    </div>
                    <div class="task-fields combat-fields" data-review-task="combat_stats" hidden>
                        <label>Attack<input id="attack" type="number" min="0" step="1" placeholder="Unknown"></label>
                        <label>Range<span class="range-pair"><input id="range_min" type="number" min="0" step="1" placeholder="Min"><span>–</span><input id="range_max" type="number" min="0" step="1" placeholder="Max"></span></label>
                        <label>Spread (°)<input id="spread_degrees" type="number" min="0" step="1" placeholder="Unknown"></label>
                        <label>Penetration (%)<input id="penetration_percent" type="number" min="0" max="100" step="1" placeholder="Unknown"></label>
                        <label>Knockback (%)<input id="knockback_percent" type="number" min="0" max="100" step="1" placeholder="Unknown"></label>
                        <label>Melee damage<input id="melee_damage" type="number" min="0" step="1" placeholder="Unknown"></label>
                        <label>Grenades remaining<input id="grenades_remaining" type="number" min="0" step="1" placeholder="Unknown"></label>
                        <label>Grenade damage<input id="grenade_damage" type="number" min="0" step="1" placeholder="Unknown"></label>
                    </div>
                    <div class="task-fields" data-review-task="soul" hidden>
                        <div id="soulSlots" class="soul-slots"></div><button id="addSoul" type="button">+ Add soul</button>
                        <p class="help">Leave empty if no souls are shown.</p>
                    </div>
                    <input id="screenKindReviewed" type="checkbox" hidden><input id="ammoReviewed" type="checkbox" hidden><input id="combatReviewed" type="checkbox" hidden><input id="soulReviewed" type="checkbox" hidden>
                    <details class="advanced-tools"><summary>Advanced</summary><button id="predictState">Auto-fill unknowns</button><p id="split" class="help"></p><label>Game crop<input id="crop" spellcheck="false"></label><button id="editCrop" type="button">Edit crop</button><button id="preview">Preview crop</button></details>
                </section></aside></div>        <section class="panel controls save-panel"><p id="saveHelp" class="help">Check every piece label before approval.</p><p id="progress" hidden></p><div class="button-row"><button id="draft">Save draft</button><button id="approve" class="primary">Approve pieces ✓</button></div><p id="status" role="status" aria-live="polite"></p></section></div>
        </main>

            </div>
        </div>
        <footer><a id="cardReviewLink" href="/cards">Card review →</a></footer>
    </div>
</body>
</html>
