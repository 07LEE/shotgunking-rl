[project]
name = "shotgun-king-rl"
version = "0.1.0"
description = "Screen-state collection and experimental agents for Shotgun King"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.3.0",
    "mss>=10.2.0",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "pyautogui>=0.9.54",
    "pywinctl>=0.4.1",
    "pyyaml>=6.0.3",
    "torch>=2.12.0",
]

[project.scripts]
shotgun-king-build-dataset = "shotgun_king_rl.collection.dataset:main"
shotgun-king-import = "shotgun_king_rl.collection.importer:main"
shotgun-king-prepare = "shotgun_king_rl.collection.prepare:main"
shotgun-king-review = "shotgun_king_rl.review.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shotgun_king_rl.review" = ["*.html", "*.css", "*.js"]
