# Shotgun King DQN training configuration

episodes: 50
batch_size: 16
max_steps_per_episode: 30
mode: "collect" # "suggest", "collect", "evaluate", or "train"
learning_rate: 0.001
epsilon_decay: 0.95
epsilon_min: 0.05
rank: 1
weapon_type: 0
current_floor: 1
trace_directory: "data/runtime_traces"
collect_epsilon: 0.05
model_path: "models/model.pth"
buffs:
  melee_kill_extra_turn: false
  move_range_bonus: 0
verbose: true
